<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Куда пойдём на свидание? 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fff1f2; --bg2:#ffe4e6; --ink:#3b1d2a; --muted:#8a5a6b;
    --accent:#e11d48; --accent2:#fb7185; --card:#ffffff; --line:#fecdd3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(circle at 20% 10%,#fff 0,transparent 40%),linear-gradient(160deg,var(--bg1),var(--bg2));
    display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden;
  }
  .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .hearts span{position:absolute;bottom:-40px;font-size:20px;opacity:.35;animation:float linear infinite}
  @keyframes float{to{transform:translateY(-110vh) rotate(25deg)}}
  .card{
    position:relative;z-index:1;width:100%;max-width:440px;background:var(--card);
    border-radius:28px;padding:28px 22px;box-shadow:0 20px 50px -20px rgba(225,29,72,.35);
    border:1px solid var(--line);
  }
  h1{font-family:'Comfortaa',sans-serif;font-size:26px;line-height:1.25;margin-bottom:12px;text-align:center}
  h2{font-family:'Comfortaa',sans-serif;font-size:20px;line-height:1.3;margin-bottom:18px}
  h3{font-family:'Comfortaa',sans-serif;font-size:16px;margin:4px 0 12px;text-align:center}
  p.lead{color:var(--muted);text-align:center;line-height:1.5;margin-bottom:24px}
  .big-emoji{font-size:64px;text-align:center;margin-bottom:10px}
  .btn{
    display:block;width:100%;border:none;cursor:pointer;font:700 17px 'Nunito',sans-serif;
    padding:15px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;box-shadow:0 8px 20px -8px rgba(225,29,72,.6);transition:transform .15s;text-align:center;text-decoration:none;
  }
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:#fff;color:var(--accent);border:2px solid var(--line);box-shadow:none;margin-top:10px}
  .progress{height:8px;background:var(--bg2);border-radius:99px;margin-bottom:8px;overflow:hidden}
  .progress div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s}
  .step{font-size:13px;color:var(--muted);margin-bottom:16px;font-weight:600}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;
    font:600 16px 'Nunito',sans-serif;color:var(--ink);cursor:pointer;transition:all .15s;
  }
  .opt:hover{border-color:var(--accent2);background:#fff7f8}
  .opt.picked{border-color:var(--accent);background:#ffe4e6;transform:scale(.98)}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .analyze{text-align:center;padding:20px 0}
  .spinner{width:64px;height:64px;margin:0 auto 20px;border-radius:50%;border:6px solid var(--bg2);border-top-color:var(--accent);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .analyze-line{color:var(--muted);font-weight:600;min-height:24px}

  .profile{background:#fff7f8;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:20px}
  .bar{margin-bottom:10px}
  .bar:last-child{margin-bottom:0}
  .bar-head{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:4px}
  .bar-head span:last-child{color:var(--accent)}
  .bar-track{height:8px;background:#fff;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width 1s ease}

  .reveal{text-align:center;color:var(--muted);font-weight:600;margin-bottom:6px}
  .result-title{font-family:'Comfortaa',sans-serif;font-size:24px;text-align:center;margin-bottom:6px;color:var(--accent)}
  .result-sub{text-align:center;color:var(--muted);font-weight:600;margin-bottom:16px}
  .result-text{line-height:1.6;margin-bottom:18px;text-align:center}
  .toast{text-align:center;font-size:14px;color:var(--accent);min-height:18px;margin-top:8px;font-weight:600}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<div class="card" id="app"></div>

<script>
const TRAITS = {
  romance:"💕 Романтика",
  culture:"🦢 Утончённость",
  creative:"🎨 Творчество",
  adventure:"🗝️ Жажда приключений",
  active:"⚡ Энергия",
  cozy:"🧸 Любовь к уюту"
};

const RESULTS = {
  romance:{emoji:"🌃",title:"Ужин в куполе на крыше",sub:"Ты — романтик до мозга костей",
    text:"Тёплый прозрачный купол, вид на ночной город и оперный, вкусная еда и только мы вдвоём. Никто не мешает, можно болтать хоть до утра."},
  active:{emoji:"⛸️",title:"Каток + горячий какао",sub:"Ты — энергия и движ",
    text:"Катаемся, держимся за руки (и друг за друга, когда падаем 😅), а потом греемся чем-нибудь горячим и вкусным."},
  culture:{emoji:"🩰",title:"Вечер в оперном театре",sub:"Ты — утончённая натура",
    text:"Наряжаемся, идём на балет в НОВАТ — самый большой театр страны. Красиво, торжественно, а после — прогулка по вечернему центру."},
  creative:{emoji:"🏺",title:"Гончарное свидание",sub:"Ты — творческая душа",
    text:"Лепим что-нибудь на гончарном круге вдвоём, руками в глине, как в том самом фильме. А потом забираем свои кружки домой на память."},
  adventure:{emoji:"🗝️",title:"Квест на двоих",sub:"Ты — искательница приключений",
    text:"Запертая комната, загадки, таймер и немного страшно. Проверим, какая мы команда — и кто первый испугается 👀"},
  cozy:{emoji:"🧸",title:"Уютный вечер: настолки и кино",sub:"Ты — королева уюта",
    text:"Антикафе с настолками, чай и печеньки, а потом кино на последнем ряду. Без суеты, зато очень тепло."}
};

// each answer: [text, {trait: points, ...}]
const QUESTIONS = [
  {q:"Идеальный вечер пятницы — это…", a:[
    ["Красиво одеться и куда-нибудь выбраться ✨",{culture:2,romance:1}],
    ["Движ! Сидеть на месте — не моё 💃",{active:2,adventure:1}],
    ["Плед, чай и что-нибудь посмотреть ☕",{cozy:2,romance:1}],
    ["Попробовать что-то, чего ещё не делала 🤔",{adventure:2,creative:1}]]},
  {q:"Какое время суток твоё?", a:[
    ["Утро, когда всё только начинается ☀️",{active:2,creative:1}],
    ["День, чтобы всё успеть 🌤️",{culture:1,adventure:1}],
    ["Закат и ранний вечер 🌅",{romance:2,culture:1}],
    ["Ночь 🌙",{cozy:2,adventure:1}]]},
  {q:"Выбери суперсилу:", a:[
    ["Телепортироваться куда угодно 🌍",{romance:2,adventure:1}],
    ["Создавать руками что угодно 🪄",{creative:3}],
    ["Читать мысли 🔮",{adventure:2,culture:1}],
    ["Никогда не уставать ⚡",{active:3}],
    ["Останавливать время ⏳",{cozy:2,romance:1}]]},
  {q:"Ты в отпуске. Чем занимаешься?", a:[
    ["Валяюсь на пляже, и никто меня не трогает 🏖️",{cozy:2,romance:1}],
    ["Лезу в горы, катаюсь, плаваю 🧗‍♀️",{active:2,adventure:1}],
    ["Хожу по музеям и красивым улочкам 🏛️",{culture:2,creative:1}],
    ["Ищу секретные места, которых нет в путеводителях 🗺️",{adventure:2,creative:1}]]},
  {q:"Какое кино включаем?", a:[
    ["Романтическую комедию 💕",{romance:2,cozy:1}],
    ["Детектив или хоррор 🔪",{adventure:3}],
    ["Уютный мультик 🦊",{cozy:2,creative:1}],
    ["Что-то красивое, с музыкой и танцами 🎻",{culture:2,romance:1}],
    ["Боевик, чтобы всё взрывалось 💥",{active:2,adventure:1}]]},
  {q:"Какое животное тебе ближе?", a:[
    ["Котик, который спит на солнышке 🐈",{cozy:3}],
    ["Хитрая лиса 🦊",{adventure:2,creative:1}],
    ["Лебедь 🦢",{culture:2,romance:1}],
    ["Белка, которая носится туда-сюда 🐿️",{active:3}],
    ["Сова 🦉",{creative:2,culture:1}]]},
  {q:"Как ты относишься к сюрпризам?", a:[
    ["Обожаю, чем неожиданнее, тем лучше! 🎉",{adventure:2,active:1}],
    ["Люблю, если красиво и продуманно 🎀",{romance:2,culture:1}],
    ["Лучше знать заранее, мне нужно подготовиться 😅",{cozy:2,culture:1}],
    ["Больше всего люблю, когда сделано своими руками 🤲",{creative:2,romance:1}]]},
  {q:"Испачкать руки ради веселья?", a:[
    ["Обожаю, давай! 🙌",{creative:3}],
    ["Если это часть загадки, то ок 🧩",{adventure:2}],
    ["Нет, я в белом 💅",{culture:2,romance:1}],
    ["Если будет весело, почему нет 😄",{active:2,creative:1}]]},
  {q:"На улице −25. Твои действия?", a:[
    ["Всё равно гулять! Красные щёки — это мило ❄️",{active:3}],
    ["Только туда, где тепло и красиво 🏛️",{culture:2,romance:1}],
    ["Под одеяло, и не трогайте меня 🫠",{cozy:3}],
    ["В тепло, но чтобы было чем заняться 🎯",{adventure:1,creative:2}]]},
  {q:"Что играет у тебя в наушниках?", a:[
    ["Классика или красивые саундтреки 🎼",{culture:3}],
    ["Попса, чтобы подпевать во весь голос 🎤",{active:2,romance:1}],
    ["Lo-fi и что-то спокойное 🌙",{cozy:2,creative:1}],
    ["Что-то необычное, о чём мало кто знает 🎧",{creative:2,adventure:1}],
    ["Что-то мрачное и атмосферное 🖤",{adventure:2,culture:1}]]},
  {q:"Если бы ты была напитком:", a:[
    ["Бокал вина 🍷",{romance:2,culture:1}],
    ["Какао с маршмеллоу ☕",{cozy:3}],
    ["Энергетик ⚡",{active:2,adventure:1}],
    ["Матча-латте 🍵",{creative:2,culture:1}],
    ["Крепкий чёрный кофе ☕",{adventure:2,active:1}]]},
  {q:"Что для тебя главное на свидании?", a:[
    ["Разговоры по душам 💬",{romance:2,cozy:1}],
    ["Эмоции и адреналин 🎢",{adventure:2,active:2}],
    ["Атмосфера и красивые фото 📸",{culture:2,romance:1}],
    ["Делать что-то вместе 🤝",{creative:2,active:1}]]},
  {q:"Выбери цвет, который тебе сейчас ближе:", a:[
    ["Красный ❤️",{romance:2,active:1}],
    ["Глубокий синий 💙",{culture:2,cozy:1}],
    ["Изумрудный 💚",{adventure:2,active:1}],
    ["Солнечно-жёлтый 💛",{creative:2,active:1}],
    ["Нежно-бежевый 🤍",{cozy:2,romance:1}]]},
  {q:"И последний: какой ты смайлик?", a:[
    ["🥰",{romance:3}],["🤪",{active:2,creative:1}],["🧐",{adventure:2,culture:1}],["😴",{cozy:3}],["💅",{culture:3}]]}
];

const ORDER = ["romance","culture","creative","adventure","active","cozy"];
let i = 0, score = {};
const app = document.getElementById("app");

function start(){
  app.innerHTML = `
    <div class="fade">
      <div class="big-emoji">💌</div>
      <h1>Куда пойдём на свидание?</h1>
      <p class="lead"><b>Официальное заявление:</b> я понятия не имею, куда тебя сводить 🤷‍♂️<br>Я долго думал, гуглил, советовался… и сдался. Поэтому решение доверено <b>науке</b> 🧪<br><br>Перед тобой ${QUESTIONS.length} вопросов. Отвечай честно и не думай долго, а алгоритм сам вычислит идеальное место 😉</p>
      <button class="btn" onclick="begin()">Поехали!</button>
    </div>`;
}
function begin(){ i = 0; score = {}; ORDER.forEach(k=>score[k]=0); show(); }

function show(){
  const item = QUESTIONS[i];
  const pct = Math.round(i / QUESTIONS.length * 100);
  app.innerHTML = `
    <div class="fade">
      <div class="progress"><div style="width:${pct}%"></div></div>
      <div class="step">Вопрос ${i+1} из ${QUESTIONS.length}</div>
      <h2>${item.q}</h2>
      <div class="opts">
        ${item.a.map((o,n)=>`<button class="opt" data-n="${n}">${o[0]}</button>`).join("")}
      </div>
    </div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b, item.a[+b.dataset.n][1]));
}

function pick(btn, pts){
  btn.classList.add("picked");
  app.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  for(const k in pts) score[k] += pts[k];
  setTimeout(()=>{ i++; i < QUESTIONS.length ? show() : analyze(); }, 280);
}

function analyze(){
  const lines = [
    "Изучаю твои ответы…",
    "Измеряю уровень романтики 💕",
    "Проверяю жажду приключений 🗝️",
    "Считаю любовь к уюту 🧸",
    "Подбираю идеальное место ✨"
  ];
  app.innerHTML = `
    <div class="analyze fade">
      <div class="spinner"></div>
      <h3>Анализирую…</h3>
      <div class="analyze-line" id="aline">${lines[0]}</div>
    </div>`;
  let n = 0;
  const t = setInterval(()=>{
    n++;
    if(n < lines.length){ document.getElementById("aline").textContent = lines[n]; }
    else { clearInterval(t); finish(); }
  }, 750);
}

function finish(){
  const max = Math.max(...ORDER.map(k=>score[k])) || 1;
  const ranked = [...ORDER].sort((a,b)=>score[b]-score[a]);
  const topKey = ranked[0], top = RESULTS[topKey];
  const pct = k => Math.max(8, Math.round(score[k] / max * 100));
  const msg = `Я прошла тест! 💌 Мне выпало: ${top.emoji} ${top.title}. Жду свидания 😘`;

  app.innerHTML = `
    <div class="fade">
      <h3>Твой профиль</h3>
      <div class="profile">
        ${ranked.map(k=>`
          <div class="bar">
            <div class="bar-head"><span>${TRAITS[k]}</span><span>${pct(k)}%</span></div>
            <div class="bar-track"><div class="bar-fill" data-w="${pct(k)}"></div></div>
          </div>`).join("")}
      </div>
      <div class="reveal">Итак, мы идём…</div>
      <div class="big-emoji">${top.emoji}</div>
      <div class="result-title">${top.title}</div>
      <div class="result-sub">${top.sub}</div>
      <p class="result-text">${top.text}</p>
      <a class="btn" href="https://t.me/share/url?url=%20&text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Отправить результат в Telegram ✈️</a>
      <button class="btn ghost" id="copy">Скопировать результат</button>
      <div class="toast" id="toast"></div>
    </div>`;
  requestAnimationFrame(()=>setTimeout(()=>{
    app.querySelectorAll(".bar-fill").forEach(b=>b.style.width=b.dataset.w+"%");
  },50));
  document.getElementById("copy").onclick = async ()=>{
    const t = document.getElementById("toast");
    try{ await navigator.clipboard.writeText(msg); t.textContent = "Скопировано! Отправь мне 💕"; }
    catch(e){ t.textContent = msg; }
  };
  burst();
}

function burst(){
  const h = document.getElementById("hearts");
  for(let k=0;k<18;k++){
    const s=document.createElement("span");
    s.textContent=["💖","💕","✨","💗"][k%4];
    s.style.left=Math.random()*100+"vw";
    s.style.fontSize=(16+Math.random()*20)+"px";
    s.style.animationDuration=(3+Math.random()*3)+"s";
    s.style.opacity=.8;
    h.appendChild(s); setTimeout(()=>s.remove(),6500);
  }
}

(function bg(){
  const h=document.getElementById("hearts");
  for(let k=0;k<10;k++){
    const s=document.createElement("span");
    s.textContent="♥";s.style.color="#fb7185";
    s.style.left=Math.random()*100+"vw";
    s.style.animationDuration=(10+Math.random()*10)+"s";
    s.style.animationDelay=(-Math.random()*15)+"s";
    h.appendChild(s);
  }
})();
start();
</script>
</body>
</html>
